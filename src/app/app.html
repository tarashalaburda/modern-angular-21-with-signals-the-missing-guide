<div class="tools">
  <button (click)="reloadNumber()">Reload Number</button>
</div>

<div class="resource-state">
  <span class="lavel">Value</span>
  <span class="value">{{ apiNimber.value() }}</span>
  <span class="label">Status: </span>
  <span class="status"
        [attr.data-status]="apiNimber.status()"
  >{{ apiNimber.status() }}</span>
  @if (apiNimber.isLoading()) {
    <div class="busy">Loading...</div>
  }
</div>
